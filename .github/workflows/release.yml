name: Release DMG
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Build tagged version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          ./scripts/build.sh "${RELEASE_TAG#v}"
      - run: ./scripts/check.sh
      - run: ./scripts/package-dmg.sh
      - name: Sign update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          python3 scripts/make-appcast.py
      - name: Publish preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          file="dist/Agent-Relay-${RELEASE_TAG#v}-macos-arm64.dmg"
          gh release create "$RELEASE_TAG" "$file" "$file.sha256" dist/appcast.xml \
            --verify-tag --prerelease --title "Agent Relay $RELEASE_TAG" \
            --notes-file docs/release-notes.md
      - name: Publish update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-appcast.py
